name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modernized/backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Docker build
        run: docker build -t carddemo-backend:test .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modernized/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (tsc + eslint)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Docker build
        run: docker build -t carddemo-frontend:test .
