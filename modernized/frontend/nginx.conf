server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /healthz is intercepted by the Cloud Run frontend; /health reaches nginx.
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
